services:
  mysql:
    container_name: smart-event-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    container_name: smart-event-kafka
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  booking-service:
    container_name: smart-event-booking-service
    build: ./booking-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/booking_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  event-service:
    container_name: smart-event-event-service
    build: ./event-service
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/event_inventory_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
    depends_on:
      mysql:
        condition: service_healthy

  payment-service:
    container_name: smart-event-payment-service
    build: ./payment-service
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ticket-service:
    container_name: smart-event-ticket-service
    build: ./ticket-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ticket_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-use-1234567890}
      JWT_ISSUER: ${JWT_ISSUER:-smart-event-booking}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ticket-api}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-mock}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      MOCK_NOTIFICATION_FAIL: ${MOCK_NOTIFICATION_FAIL:-false}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ui:
    container_name: smart-event-ui
    build: ./ui
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - booking-service
      - event-service
      - payment-service
      - ticket-service

volumes:
  mysql-data:
