services:
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
  app:
    environment:
      NOTIFICATION_MODE: smtp
      MAIL_FROM: tickets@example.test
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      SMTP_STARTTLS_REQUIRED: "false"
      SMTP_SSL_ENABLED: "false"
    depends_on:
      mailpit:
        condition: service_started
