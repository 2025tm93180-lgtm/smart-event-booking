spring:
  datasource:
    url: jdbc:h2:mem:ticket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ''
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
app:
  security:
    jwt-secret: test-only-secret-with-at-least-32-bytes-long
    jwt-issuer: smart-event-booking
    jwt-audience: ticket-api
  kafka:
    health-enabled: false
  notifications:
    enabled: false
